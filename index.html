<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Rotating Card ±100° Full</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}
body {
display: flex;
justify-content: center;
align-items: center;
touch-action: pan-x pan-y;
}
.wrap {
width: 90vw;
max-width: 260px;
aspect-ratio: 260 / 400;
perspective: 1200px;
}
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
border-radius: 12px;
}
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
border-radius: 12px;
transition: filter 0.05s;
}
.front::after, .back::after {
content: '';
position: absolute;
inset: 10%;
pointer-events: none;
filter: blur(4px);
transform: translateX(var(--shine-x, 0%));
mix-blend-mode: screen;
border-radius: 12px;
}
.front::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.back::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.front { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png"); }
.back { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/zebra.png"); transform: rotateY(180deg); }
</style>
</head>
<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');
const back = document.querySelector('.back');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;

const DRAG_LIMIT = 100; // ±100° 正面/裏面基準
const SIDE_MARGIN = 60; // 側面判定
let manualCenter = 0;
let returning = false;

function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;
const rad = rotation * Math.PI / 180;
const angleMod = ((rotation % 360) + 360) % 360;
const sideDiff = Math.min(Math.abs(angleMod % 180 - 90)/90, 1);
const flow = (1 - sideDiff) * 0.15 * Math.sin(rad);
const brightness = 1.0 + flow;
const shineX = Math.sin(rad) * 30;
front.style.setProperty('--shine-x', `${shineX}%`);
back.style.setProperty('--shine-x', `${shineX}%`);
front.style.filter = `brightness(${brightness})`;
back.style.filter = `brightness(${brightness})`;
}

// 自動回転
function animate() {
if(autoRotate && !isDragging && !returning){
rotation += 1.6;
}
applyTransform();
requestAnimationFrame(animate);
}
animate();

// 正面に戻すアニメーション
function smoothTo(target){
returning = true;
autoRotate = false;
const speed = 0.15;
function step(){
const diff = target - rotation;
if(Math.abs(diff) < 0.5){
rotation = target;
applyTransform();
returning = false;
autoRotate = true; // 自動回転再開
return;
}
rotation += diff * speed;
applyTransform();
requestAnimationFrame(step);
}
step();
}

// ドラッグ/タッチ開始
function startDrag(e){
const angleMod = ((rotation % 360) + 360) % 360;

// 側面判定
const nearSide = !((angleMod <= SIDE_MARGIN || angleMod >= 360 - SIDE_MARGIN) ||
(angleMod >= 180 - SIDE_MARGIN && angleMod <= 180 + SIDE_MARGIN));

if(nearSide && !returning){
// 側面クリック → 正面に戻す
returning = true;
autoRotate = false;
isDragging = false;
if(angleMod < 180){
smoothTo(0);
} else {
smoothTo(180);
}
} else if(!returning){
// 正面/裏正面はドラッグ可能
isDragging = true;
autoRotate = false;
lastX = getX(e);
manualCenter = (angleMod < 90 || angleMod > 270) ? 0 : 180; // 正面/裏面基準
}
}

// ドラッグ中
function onDrag(e){
if(!isDragging || returning) return;
let delta = (getX(e) - lastX) * 1.0; // 変換率を大きくして ±100° を使いやすく
delta = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, delta));
rotation = manualCenter + delta;
lastX = getX(e);
applyTransform();
}

// ドラッグ終了
function endDrag(){
if(isDragging){
isDragging = false;
autoRotate = true;
}
}

// マウス
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

// タッチ
card.addEventListener('touchstart', startDrag,{passive:true});
card.addEventListener('touchmove', onDrag,{passive:true});
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
