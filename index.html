<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rotating Card with Natural Light</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}

body {
display: flex;
justify-content: center;
align-items: center;
touch-action: pan-x pan-y;
}

/* ラッパー */
.wrap {
width: 90vw;
max-width: 260px;
aspect-ratio: 260 / 400;
perspective: 1200px; /* 遠近感 */
}

/* カード */
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
border-radius: 12px;
}

/* 表裏共通 */
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
overflow: hidden;
border-radius: 12px;
transition: filter 0.05s;
}

/* 表面の反射 */
.front::after {
content: '';
position: absolute;
inset: 10%;
pointer-events: none;
background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%);
filter: blur(4px);
transform: translateX(var(--shine-x, 0%));
mix-blend-mode: screen;
opacity: 0.6;
border-radius: 12px;
}

/* 裏面の反射 */
.back::after {
content: '';
position: absolute;
inset: 10%;
pointer-events: none;
background: linear-gradient(110deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%);
filter: blur(4px);
transform: translateX(var(--shine-x, 0%));
mix-blend-mode: screen;
opacity: 0.5;
border-radius: 12px;
}

/* 表裏画像 */
.front {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png");
}

.back {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png");
transform: rotateY(180deg);
}
</style>
</head>
<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');
const back = document.querySelector('.back');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
let manualCenter = 0;

const SPEED = 1.6;
const DRAG_LIMIT = 55;
const DRAG_SENS = 0.3;

/* 光と自然な影を角度に応じて変える */
function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;

const rad = rotation * Math.PI / 180;

// ハイライトの横移動
const shineX = Math.sin(rad) * 30; // 左右の立体感
front.style.setProperty('--shine-x', `${shineX}%`);
back.style.setProperty('--shine-x', `${shineX}%`);

// 正面が一番明るくなるように明るさを cos で制御
const baseBrightness = 0.75;
const dynamic = 0.25 * Math.cos(rad); // cos(0)=1 → 正面明るく
const brightness = baseBrightness + dynamic; // 0.75〜1.0
front.style.filter = `brightness(${brightness})`;
back.style.filter = `brightness(${brightness})`;
}

/* 自動回転 */
function animate() {
if(autoRotate && !isDragging){
rotation += SPEED;
}
applyTransform();
requestAnimationFrame(animate);
}
animate();

/* ドラッグ操作 */
function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

function startDrag(e){
isDragging = true;
autoRotate = false;
lastX = getX(e);
const a = ((rotation % 360)+360)%360;
manualCenter = (a<90 || a>270)? rotation-a : rotation-(a-180);
}

function onDrag(e){
if(!isDragging) return;
let offset = (getX(e)-lastX)*DRAG_SENS;
offset = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, offset));
rotation = manualCenter + offset;
applyTransform();
lastX = getX(e);
}

function endDrag(){
isDragging = false;
autoRotate = true;
}

// マウス
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

// タッチ
card.addEventListener('touchstart', startDrag,{passive:true});
card.addEventListener('touchmove', onDrag,{passive:true});
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
