<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Card Final</title>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
background: transparent;
}

body {
display: flex;
justify-content: center;
align-items: center;
}

/* ===== ラッパー ===== */
.wrap {
position: relative;
width: 260px;
height: 400px;
perspective: 1200px;
}

/* ケース縁（回らない） */
.wrap::before {
content: '';
position: absolute;
inset: 0;
border: 1px solid rgba(0,0,0,0.18);
box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset;
border-radius: 2px;
pointer-events: none;
}

/* ===== カード ===== */
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
cursor: grab;
user-select: none;
touch-action: none;
}

.card:active {
cursor: grabbing;
}

/* 疑似的な厚み */
.card::before,
.card::after {
content: '';
position: absolute;
top: 2px;
bottom: 2px;
width: var(--edge-w, 4px);
background: rgba(0,0,0,var(--edge-a,0.18));
pointer-events: none;
}

.card::before { left: 0; }
.card::after { right: 0; }

/* ===== 表裏 ===== */
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
}

.front {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png");
}

.back {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png");
transform: rotateY(180deg);
}
</style>
</head>

<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');

/* ===== 状態 ===== */
let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
let dragBaseRotation = 0;

/* ===== パラメータ ===== */
const SPEED = 0.1; // 自動回転速度（deg/ms）
const DRAG_LIMIT = 35; // 手動操作の可動幅
const SIDE_ZONE = 15; // 真横前後の加速ゾーン
const BOOST_RATE = 0.35; // 加速率

let lastTime = performance.now();

/* ===== 厚み演出 ===== */
function updateEdge() {
const a = ((rotation % 360) + 360) % 360;
const d = Math.abs(90 - (a % 180));
const t = Math.max(0, 1 - d / 40);

const w = 2 + t * 6;
const alpha = 0.12 + t * 0.35;

card.style.setProperty('--edge-w', `${w}px`);
card.style.setProperty('--edge-a', alpha);
}

/* ===== 自動回転 ===== */
function animate(time) {
const delta = time - lastTime;
lastTime = time;

if (autoRotate && !isDragging) {
let speed = SPEED;

const angle = ((rotation % 360) + 360) % 360;
const near90 = Math.abs(angle - 90) < SIDE_ZONE;
const near270 = Math.abs(angle - 270) < SIDE_ZONE;

if (near90 || near270) {
speed *= (1 + BOOST_RATE);
}

rotation += speed * delta;
card.style.transform = `rotateY(${rotation}deg)`;
updateEdge();
}

requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ===== 入力 ===== */
function getX(e) {
return e.touches ? e.touches[0].clientX : e.clientX;
}

function startDrag(e) {
isDragging = true;
autoRotate = false;
lastX = getX(e);

/* ← ここが重要 */
dragBaseRotation = rotation;
}

function onDrag(e) {
if (!isDragging) return;

const x = getX(e);
const dx = x - lastX;

const deltaAngle = dx * 0.6;

/* 基準角度からの相対移動 */
let offset = rotation + deltaAngle - dragBaseRotation;

/* 相対量だけ制限 */
offset = Math.max(
-DRAG_LIMIT,
Math.min(DRAG_LIMIT, offset)
);

rotation = dragBaseRotation + offset;
card.style.transform = `rotateY(${rotation}deg)`;
updateEdge();

lastX = x;
}

function endDrag() {
isDragging = false;
autoRotate = true;
}

/* マウス */
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

/* タッチ */
card.addEventListener('touchstart', startDrag, { passive: true });
card.addEventListener('touchmove', onDrag, { passive: true });
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
