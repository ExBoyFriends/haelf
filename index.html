<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Thick Rotating Card</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}

body {
display: flex;
justify-content: center;
align-items: center;
touch-action: pan-x pan-y;
}

/* ラッパー */
.wrap {
width: 90vw;
max-width: 260px;
aspect-ratio: 260 / 400;
perspective: 1200px;
}

/* カード */
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
border-radius: 12px;
}

/* 表裏共通 */
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
overflow: hidden;
border-radius: 12px;
transition: filter 0.05s;
}

/* 反射 */
.front::after, .back::after {
content: '';
position: absolute;
inset: 10%;
pointer-events: none;
filter: blur(4px);
transform: translateX(var(--shine-x, 0%));
mix-blend-mode: screen;
border-radius: 12px;
}
.front::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.back::after { background: linear-gradient(110deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0) 100%); opacity: 0.5; }

/* 表裏画像 */
.front { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png"); }
.back { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/zebra.png"); transform: rotateY(180deg); }

/* 側面 */
.side {
position: absolute;
top: 0;
bottom: 0;
width: 4px; /* 厚み */
background: rgba(255, 255, 255, 0.05);
border-radius: 12px;
transform-origin: center;
}
.left { left: 0; transform: rotateY(90deg) translateX(-50%); }
.right { right: 0; transform: rotateY(-90deg) translateX(50%); }

</style>
</head>
<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
<div class="side left"></div>
<div class="side right"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');
const back = document.querySelector('.back');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
let manualCenter = 0;

const SPEED = 1.6;
const DRAG_LIMIT = 90; // ドラッグ範囲を広げた
const DRAG_SENS = 0.3;

// 光と明るさ
function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;

const rad = rotation * Math.PI / 180;

// ハイライト横移動
const shineX = Math.sin(rad) * 30;
front.style.setProperty('--shine-x', `${shineX}%`);
back.style.setProperty('--shine-x', `${shineX}%`);

// 左右の光の流れを統一
const base = 0.75;
const brightness = base + 0.25 * Math.sin(rad);
front.style.filter = `brightness(${brightness})`;
back.style.filter = `brightness(${brightness})`;
}

// 自動回転
function animate() {
if(autoRotate && !isDragging){
rotation += SPEED;
}
applyTransform();
requestAnimationFrame(animate);
}
animate();

// ドラッグ操作
function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

function startDrag(e){
isDragging = true;
autoRotate = false;
lastX = getX(e);
const a = ((rotation % 360)+360)%360;
manualCenter = (a<90 || a>270)? rotation-a : rotation-(a-180);
}

function onDrag(e){
if(!isDragging) return;
let offset = (getX(e)-lastX)*DRAG_SENS;
offset = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, offset));
rotation = manualCenter + offset;
applyTransform();
lastX = getX(e);
}

function endDrag(){
isDragging = false;
autoRotate = true;
}

// マウス
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

// タッチ
card.addEventListener('touchstart', startDrag,{passive:true});
card.addEventListener('touchmove', onDrag,{passive:true});
card.addEventListener('touchend', endDrag);

// タップで停止/再開
card.addEventListener('click', () => { autoRotate = !autoRotate; });

</script>

</body>
</html>
