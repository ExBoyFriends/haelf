<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Responsive Rotating Card</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}

body {
display: flex;
justify-content: center;
align-items: center;
touch-action: pan-x pan-y;
}

/* ===== ラッパー ===== */
.wrap {
width: 90vw; /* 横幅に合わせる */
max-width: 260px; /* 元カード上限サイズ */
aspect-ratio: 260 / 400; /* 縦横比維持 */
height: auto; /* 高さは自動 */
perspective: 1200px;
}

/* ===== カード ===== */
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
}

/* ===== 表裏共通 ===== */
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
overflow: hidden;
}

/* ===== 表面の反射 ===== */
.front::after {
content: '';
position: absolute;
inset: 12%;
pointer-events: none;
background:
linear-gradient(110deg, rgba(255,255,255,0) 40%, rgba(255,255,255,0.10) 46%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.10) 54%, rgba(255,255,255,0) 60%),
linear-gradient(105deg, rgba(255,255,255,0) 42%, rgba(255,255,255,0.06) 48%, rgba(255,255,255,0.14) 52%, rgba(255,255,255,0.06) 56%, rgba(255,255,255,0) 62%);
filter: blur(6px);
transform: translateX(var(--shine-x, 0%)) scaleX(var(--shine-s, 0.6));
mix-blend-mode: screen;
opacity: calc(0.75 + var(--shine-edge, 0));
}

/* ===== 裏面の反射 ===== */
.back::after {
content: '';
position: absolute;
inset: 14%;
pointer-events: none;
background:
linear-gradient(110deg, rgba(255,255,255,0) 42%, rgba(255,255,255,0.08) 48%, rgba(255,255,255,0.16) 52%, rgba(255,255,255,0.08) 56%, rgba(255,255,255,0) 62%);
filter: blur(8px);
transform: translateX(var(--shine-x, 0%)) scaleX(calc(var(--shine-s, 0.6) * 1.05));
mix-blend-mode: screen;
opacity: 0.5;
}

/* 表裏画像 */
.front {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png");
}

.back {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png");
transform: rotateY(180deg);
}
</style>
</head>
<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');
const back = document.querySelector('.back');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
let manualCenter = 0;

const SPEED = 1.6;
const DRAG_LIMIT = 55;
const DRAG_SENS = 0.3;

/* ===== 光と変形適用 ===== */
function applyTransform(){
const a = ((rotation % 180) + 180) % 180;
const edge = Math.max(0, 1 - Math.abs(a-90)/25);

// 真横でも角が隠れないよう控えめZ
const z = edge * 3;
card.style.transform = `translateZ(${z}px) rotateY(${rotation}deg)`;

// 光
const d = Math.abs(a-90);
const t = Math.max(0, 1 - d/120);
const x = -18 + t*36;
const s = 0.55 + t*0.45;
const edgeBoost = Math.pow(edge,2) * 0.35;

front.style.setProperty('--shine-x', `${x}%`);
front.style.setProperty('--shine-s', s.toFixed(3));
front.style.setProperty('--shine-edge', edgeBoost.toFixed(3));

back.style.setProperty('--shine-x', `${x}%`);
back.style.setProperty('--shine-s', s.toFixed(3));
back.style.setProperty('--shine-edge', (edgeBoost*0.6).toFixed(3));
}

/* ===== 自動回転 ===== */
function animate(){
if(autoRotate && !isDragging){
const a = ((rotation % 180) + 180) % 180;
const preEdge = Math.max(0, 1 - Math.abs(a-75)/10);
const accel = Math.pow(preEdge,3)*0.6; // 控えめ加速
rotation += SPEED + accel;
}
applyTransform();
requestAnimationFrame(animate);
}
animate();

/* ===== ドラッグ操作 ===== */
function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

function startDrag(e){
isDragging = true;
autoRotate = false;
lastX = getX(e);
const a = ((rotation % 360)+360)%360;
manualCenter = (a<90 || a>270)? rotation-a : rotation-(a-180);
}

function onDrag(e){
if(!isDragging) return;
let offset = (getX(e)-lastX)*DRAG_SENS;
offset = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, offset));
rotation = manualCenter + offset;
applyTransform();
lastX = getX(e);
}

function endDrag(){
isDragging = false;
autoRotate = true;
}

// マウス
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

// タッチ
card.addEventListener('touchstart', startDrag,{passive:true});
card.addEventListener('touchmove', onDrag,{passive:true});
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
