<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Rotating Card</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}
body {
display: flex;
justify-content: center;
align-items: center;
touch-action: pan-x pan-y;
}
.wrap {
width: 90vw;
max-width: 260px;
aspect-ratio: 260 / 400;
perspective: 1200px;
}
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
border-radius: 12px;
}
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
border-radius: 12px;
transition: filter 0.05s;
}
.front::after, .back::after {
content: '';
position: absolute;
inset: 10%;
pointer-events: none;
filter: blur(4px);
transform: translateX(var(--shine-x, 0%));
mix-blend-mode: screen;
border-radius: 12px;
}
.front::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.back::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.front { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png"); }
.back { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/zebra.png"); transform: rotateY(180deg); }
</style>
</head>
<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');
const back = document.querySelector('.back');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
const DRAG_SENS = 0.3;
const SIDE_ANGLE = 75; // ±75°付近は側面

function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

// 光と明るさの適用
function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;

const rad = rotation * Math.PI / 180;
const angleMod = ((rotation % 360) + 360) % 360;

// 表裏正面では常に明るさ最大
let baseBrightness = 1.0;

// 側面に近づくほど暗くする微調整
const sideDiff = Math.min(Math.abs(angleMod % 180 - 90) / 90, 1); // 0=正面, 1=側面
const flow = (1 - sideDiff) * 0.15 * Math.sin(rad);
const brightness = baseBrightness + flow;

// 光の方向（左右）も統一
const shineX = Math.sin(rad) * 30;

front.style.setProperty('--shine-x', `${shineX}%`);
back.style.setProperty('--shine-x', `${shineX}%`);
front.style.filter = `brightness(${brightness})`;
back.style.filter = `brightness(${brightness})`;
}

// 自動回転
function animate() {
if(autoRotate && !isDragging){
rotation += 1.6;
}
applyTransform();
requestAnimationFrame(animate);
}
animate();

// ドラッグ開始
function startDrag(e){
const angleMod = ((rotation % 360) + 360) % 360;
const sideLeft = 180 - SIDE_ANGLE;
const sideRight = SIDE_ANGLE;

// 側面付近はドラッグ無効
if(angleMod < sideRight || (angleMod > sideLeft && angleMod < 180 + sideRight) || angleMod > 360 - sideRight){
isDragging = true;
autoRotate = false;
lastX = getX(e);
} else {
// 側面クリックは近い正面に移動
autoRotate = false;
if(angleMod >= sideRight && angleMod <= 180 - sideRight){
rotation = 0; // 表
} else if(angleMod >= 180 + sideRight && angleMod <= 360 - sideRight){
rotation = 180; // 裏
}
}
}

// ドラッグ中
function onDrag(e){
if(!isDragging) return;
const delta = (getX(e) - lastX) * DRAG_SENS;
rotation += delta;
lastX = getX(e);
applyTransform();
}

// ドラッグ終了
function endDrag(){
isDragging = false;
autoRotate = true; // 離したら自動回転再開
}

// マウス
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

// タッチ
card.addEventListener('touchstart', startDrag,{passive:true});
card.addEventListener('touchmove', onDrag,{passive:true});
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
