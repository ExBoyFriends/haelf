<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Rotating Card Smooth</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}
body {
display: flex;
justify-content: center;
align-items: center;
touch-action: pan-x pan-y;
}
.wrap {
width: 90vw;
max-width: 260px;
aspect-ratio: 260 / 400;
perspective: 1200px;
}
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
border-radius: 12px;
}
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
border-radius: 12px;
transition: filter 0.05s;
}
.front::after, .back::after {
content: '';
position: absolute;
inset: 10%;
pointer-events: none;
filter: blur(4px);
transform: translateX(var(--shine-x, 0%));
mix-blend-mode: screen;
border-radius: 12px;
}
.front::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.back::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.front { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png"); }
.back { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/zebra.png"); transform: rotateY(180deg); }
</style>
</head>
<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');
const back = document.querySelector('.back');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
const DRAG_SENS = 0.3;
const DRAG_LIMIT = 60;
const SIDE_ANGLE = 75;
let manualCenter = 0;

function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

// 光と明るさ
function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;
const rad = rotation * Math.PI / 180;
const angleMod = ((rotation % 360) + 360) % 360;
let baseBrightness = 1.0;
const sideDiff = Math.min(Math.abs(angleMod % 180 - 90)/90, 1);
const flow = (1 - sideDiff) * 0.15 * Math.sin(rad);
const brightness = baseBrightness + flow;
const shineX = Math.sin(rad) * 30;
front.style.setProperty('--shine-x', `${shineX}%`);
back.style.setProperty('--shine-x', `${shineX}%`);
front.style.filter = `brightness(${brightness})`;
back.style.filter = `brightness(${brightness})`;
}

// 自動回転
function animate() {
if(autoRotate && !isDragging){
rotation += 1.6;
}
applyTransform();
requestAnimationFrame(animate);
}
animate();

// 側面クリック時に滑らかに正面に戻す
function smoothTo(target){
const speed = 0.15; // 数字大きいほど速い
function step(){
const diff = target - rotation;
if(Math.abs(diff) < 0.5){
rotation = target;
applyTransform();
return;
}
rotation += diff * speed;
applyTransform();
requestAnimationFrame(step);
}
step();
}

// ドラッグ開始
function startDrag(e){
const angleMod = ((rotation % 360) + 360) % 360;
const sideLeft = 180 - SIDE_ANGLE;
const sideRight = SIDE_ANGLE;

if(angleMod < sideRight || (angleMod > sideLeft && angleMod < 180 + sideRight) || angleMod > 360 - sideRight){
isDragging = true;
autoRotate = false;
lastX = getX(e);
manualCenter = rotation;
} else {
autoRotate = false;
if(angleMod >= sideRight && angleMod <= 180 - sideRight){
smoothTo(0);
} else if(angleMod >= 180 + sideRight && angleMod <= 360 - sideRight){
smoothTo(180);
}
}
}

// ドラッグ中
function onDrag(e){
if(!isDragging) return;
let delta = (getX(e) - lastX) * DRAG_SENS;
delta = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, delta));
rotation = manualCenter + delta;
lastX = getX(e);
applyTransform();
}

// ドラッグ終了
function endDrag(){
isDragging = false;
autoRotate = true;
}

// マウス
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

// タッチ
card.addEventListener('touchstart', startDrag,{passive:true});
card.addEventListener('touchmove', onDrag,{passive:true});
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
