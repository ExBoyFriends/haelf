<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
background: #000;
}

body {
display: flex;
justify-content: center;
align-items: center;
}

/* ラッパー */
.wrap {
width: 260px;
height: 400px;
perspective: 1200px;
}

/* カード */
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
}

/* 表裏 */
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: 110% auto;
background-position: center;
background-repeat: no-repeat;
overflow: hidden;
}

/* 表面だけ光を乗せる */
.front::after {
content: '';
position: absolute;
inset: 18%;
background: linear-gradient(
105deg,
rgba(255,255,255,0) 49.2%,
rgba(255,255,255,0.25) 49.6%,
rgba(255,255,255,0.4) 50%,
rgba(255,255,255,0.25) 50.4%,
rgba(255,255,255,0) 50.%
);
transform: translateX(var(--shine-x, 0%));
scaleX(var(--shine-s, 0.4));

 transform-origin: center;
 pointer-events: none;
 mix-blend-mode: screen;
}

/* 表 */
.front {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png");
}

/* 裏 */
.back {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png");
transform: rotateY(180deg);
}
</style>
</head>

<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
let manualCenter = 0;

const SPEED = 0.1;
const DRAG_LIMIT = 70;
const DRAG_SENS = 0.35;

let lastTime = performance.now();

/* 自動回転 */
function animate(time) {
const delta = time - lastTime;
lastTime = time;

if (autoRotate && !isDragging) {
rotation += SPEED * delta;
applyTransform();
}

requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;

/* 光の位置（正面付近で一番強く） */
const a = ((rotation % 360) + 360) % 360;
const d = Math.abs(a <= 180 ? a : 360 - a);
  
const t = Math.max(0, 1 - d / 70);

const x = (-20 + t * 40);

const s = 0.25 + t * 0.75;
front.style.setProperty('--shine-x', `${x}%`);
front.style.setProperty ('--shine-s', s.toFixed(3));
}

/* 入力 */
function getX(e) {
return e.touches ? e.touches[0].clientX : e.clientX;
}

function startDrag(e) {
isDragging = true;
autoRotate = false;
lastX = getX(e);

const a = ((rotation % 360) + 360) % 360;
manualCenter = (a < 90 || a > 270)
? rotation - a
: rotation - (a - 180);
}

function onDrag(e) {
if (!isDragging) return;

const x = getX(e);
const dx = x - lastX;

let offset = dx * DRAG_SENS;
offset = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, offset));

rotation = manualCenter + offset;
applyTransform();

lastX = x;
}

function endDrag() {
isDragging = false;
autoRotate = true;
}

/* mouse */
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

/* touch */
card.addEventListener('touchstart', startDrag, { passive: true });
card.addEventListener('touchmove', onDrag, { passive: true });
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
