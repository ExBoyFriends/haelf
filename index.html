<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokepoke Subtle 3D Card</title>
<style>
body {
margin: 0;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: transparent;
}

.card-container {
perspective: 1200px;
width: 260px;
height: 400px;
}

.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
transform-origin: center center;
cursor: grab;
user-select: none;
touch-action: none;
/* 軽い影で立体感 */
box-shadow: 0 4px 8px rgba(0,0,0,0.15);
}

.card:active {
cursor: grabbing;
}

.side {
position: absolute;
width: 100%;
height: 100%;
backface-visibility: hidden;
}

.side img {
width: 100%;
height: 100%;
object-fit: contain;
display: block;
}

.back {
transform: rotateY(180deg);
}

/* 薄い側面の表現 */
.card::before {
content: '';
position: absolute;
top: 0; bottom: 0; left: -2px; /* 少しだけ左に出す */
width: 4px; /* 厚みの幅 */
background: rgba(0,0,0,0.05), rgba(0,0,0,0); /* ほんのり暗く */
pointer-events: none;
border-radius: 1px;
z-index: -1;
}
</style>
</head>
<body>

<div class="card-container">
<div class="card" id="card">
<div class="side front">
<img src="https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png" alt="back">
</div>
<div class="side back">
<img src="https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png" alt="front">
</div>
</div>
</div>

<script>
const card = document.getElementById('card');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;

const AUTO_SPEED = 70; // 1秒で70度回転

// 自動回転ループ
let lastTime = performance.now();
function animate(time) {
const delta = time - lastTime;
lastTime = time;

if (autoRotate && !isDragging) {
rotation += AUTO_SPEED * (delta / 1000);
rotation %= 360;
card.style.transform = `rotateY(${rotation}deg)`;
}

requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// ドラッグ操作
function getX(e) {
return e.touches ? e.touches[0].clientX : e.clientX;
}
function startDrag(e) {
isDragging = true;
autoRotate = false;
lastX = getX(e);
}
function onDrag(e) {
if (!isDragging) return;
const currentX = getX(e);
const deltaX = currentX - lastX;
rotation += deltaX * 0.6;
rotation %= 360;
card.style.transform = `rotateY(${rotation}deg)`;
lastX = currentX;
}
function endDrag() {
isDragging = false;
autoRotate = true;
}

card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);
card.addEventListener('touchstart', startDrag);
card.addEventListener('touchmove', onDrag);
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
