<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
background: transparent;
}

body {
display: flex;
justify-content: center;
align-items: center;
}

.wrap {
position: relative;
width: 260px;
height: 400px;
perspective: 1200px;
}

.wrap::before {
content: '';
position: absolute;
inset: 0;
border: 1px solid rgba(0,0,0,0.18);
box-shadow: 0 0 0 1px rgba(255,255,255,0.25) inset;
pointer-events: none;
}

.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
cursor: grab;
user-select: none;
touch-action: none;
}

.card::before,
.card::after {
content: '';
position: absolute;
top: 2px;
bottom: 2px;
width: var(--edge-w, 4px);
background: rgba(0,0,0,var(--edge-a,0.18));
pointer-events: none;
}

.card::before { left: 0; }
.card::after { right: 0; }

.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
}

.front {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png");
}

.back {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png");
transform: rotateY(180deg);
}
</style>
</head>

<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;

/* ★ 手動操作の中心（常に正面） */
let manualCenter = 0;

const SPEED = 0.1;
const DRAG_LIMIT = 35; // ← 常にこの幅だけ見える
const SIDE_ZONE = 15;
const BOOST_RATE = 0.35;

let lastTime = performance.now();

/* ===== 厚み ===== */
function updateEdge() {
const a = ((rotation % 360) + 360) % 360;
const d = Math.abs(90 - (a % 180));
const t = Math.max(0, 1 - d / 40);

card.style.setProperty('--edge-w', `${2 + t * 6}px`);
card.style.setProperty('--edge-a', 0.12 + t * 0.35);
}

/* ===== 自動回転 ===== */
function animate(time) {
const delta = time - lastTime;
lastTime = time;

if (autoRotate && !isDragging) {
let speed = SPEED;
const a = ((rotation % 360) + 360) % 360;

if (Math.abs(a - 90) < SIDE_ZONE || Math.abs(a - 270) < SIDE_ZONE) {
speed *= 1 + BOOST_RATE;
}

rotation += speed * delta;
card.style.transform = `rotateY(${rotation}deg)`;
updateEdge();
}

requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

/* ===== 入力 ===== */
function getX(e) {
return e.touches ? e.touches[0].clientX : e.clientX;
}

function startDrag(e) {
isDragging = true;
autoRotate = false;
lastX = getX(e);

/* ★ 現在角度から「最も近い正面」を基準に固定 */
const a = ((rotation % 360) + 360) % 360;
manualCenter = a < 90 || a > 270
? rotation - a // 表（0度）
: rotation - (a - 180); // 裏（180度）
}

function onDrag(e) {
if (!isDragging) return;

const x = getX(e);
const dx = x - lastX;

let offset = dx * 0.6;
offset = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, offset));

rotation = manualCenter + offset;
card.style.transform = `rotateY(${rotation}deg)`;
updateEdge();

lastX = x;
}

function endDrag() {
isDragging = false;
autoRotate = true;
}

/* mouse */
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

/* touch */
card.addEventListener('touchstart', startDrag, { passive: true });
card.addEventListener('touchmove', onDrag, { passive: true });
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
