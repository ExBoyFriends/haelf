<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pokepoke 3D Card</title>
<style>
body {
margin: 0;
height: 100vh;
display: flex;
justify-content: center;
align-items: center;
background: transparent;
}

.card-container {
perspective: 1200px;
width: 260px;
height: 400px;
}

.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
transform-origin: center center;
cursor: grab;
user-select: none;
touch-action: none;
/* 厚み感の影 */
box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

/* 擬似側面 */
.card-side-shadow {
position: absolute;
top: 0; bottom: 0; left: 0; right: 0;
background: linear-gradient(to right, rgba(0,0,0,0.2), rgba(0,0,0,0));
transform: rotateY(90deg);
transform-origin: left center;
pointer-events: none; /* カード操作を邪魔しない */
}

.card:active {
cursor: grabbing;
}

.side {
position: absolute;
width: 100%;
height: 100%;
backface-visibility: hidden;
}

.side img {
width: 100%;
height: 100%;
object-fit: contain;
display: block;
}

.back {
transform: rotateY(180deg);
}
</style>
</head>
<body>

<div class="card-container">
<div class="card" id="card">
<div class="side front">
<img　src="https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png" alt="front">
</div>
<div class="side back">
<img src="https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png" alt="back">
</div>
<!-- 擬似側面 -->
<div class="card-side-shadow"></div>
</div>
</div>

<script>
const card = document.getElementById('card');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;

const AUTO_SPEED = 180; // 1秒で180度回転

// 自動回転ループ
let lastTime = performance.now();
function animate(time) {
const delta = time - lastTime;
lastTime = time;

if (autoRotate && !isDragging) {
rotation += AUTO_SPEED * (delta / 1000);
rotation %= 360;
card.style.transform = `rotateY(${rotation}deg)`;
}

requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// タッチ・マウス共通
function getX(e) {
return e.touches ? e.touches[0].clientX : e.clientX;
}

function startDrag(e) {
isDragging = true;
autoRotate = false;
lastX = getX(e);
}

function onDrag(e) {
if (!isDragging) return;

const currentX = getX(e);
const deltaX = currentX - lastX;
rotation += deltaX * 0.6;
rotation %= 360;

card.style.transform = `rotateY(${rotation}deg)`;
lastX = currentX;
}

function endDrag() {
isDragging = false;
autoRotate = true;
}

// マウスイベント
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

// タッチイベント
card.addEventListener('touchstart', startDrag);
card.addEventListener('touchmove', onDrag);
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
</script>

</body>
</html>
