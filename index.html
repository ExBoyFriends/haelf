<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rotating Card with Case</title>

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
background: transparent;
}

body {
display: flex;
justify-content: center;
align-items: center;
}

/* ===== ラッパー（3D用） ===== */
.wrap {
position: relative;
width: 260px;
height: 400px;
perspective: 1200px;
}

/* ===== ケースの縁（厚みの正体） ===== */
.wrap::before {
content: '';
position: absolute;
inset: 0;

/* ケース感 */
border: 1px solid rgba(0, 0, 0, 0.18);
box-shadow:
0 0 0 1px rgba(255,255,255,0.25) inset;

border-radius: 2px;
pointer-events: none;
}

/* ===== カード本体 ===== */
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
}

/* ===== 表裏 ===== */
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;

background-size: cover;
background-position: center;
background-repeat: no-repeat;
}

/* 表 */
.front {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png");
}

/* 裏 */
.back {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png");
transform: rotateY(180deg);
}
</style>
</head>

<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');

let rotation = 0;
const SPEED = 0.4; // 回転速度（ここだけ好みで調整）

function animate() {
rotation += SPEED;
card.style.transform = `rotateY(${rotation}deg)`;
requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
