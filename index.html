<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body {
margin: 0;
width: 100%;
height: 100%;
background: #000;
}

body {
display: flex;
justify-content: center;
align-items: center;
}

/* ラッパー */
.wrap {
width: 260px;
height: 400px;
perspective: 1200px;
}

/* カード */
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
}

/* 表裏 */
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: 110% auto;
background-position: center;
background-repeat: no-repeat;
overflow: hidden;
}

/* 表面だけ光を乗せる */
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
}

/* ===== 表面の反射 ===== */
.front::after {
opacity: calc(0.85 + var(--shine-edge, 0));
content: '';
position: absolute;
inset: 10%;
pointer-events: none;

background:
linear-gradient(
110deg,
rgba(255,255,255,0) 40%,
rgba(255,255,255,0.10) 46%,
rgba(255,255,255,0.22) 50%,
rgba(255,255,255,0.10) 54%,
rgba(255,255,255,0) 60%
),
linear-gradient(
105deg,
rgba(255,255,255,0) 42%,
rgba(255,255,255,0.06) 48%,
rgba(255,255,255,0.14) 52%,
rgba(255,255,255,0.06) 56%,
rgba(255,255,255,0) 62%
);

filter: blur(6px);
transform:
translateX(var(--shine-x, 0%))
scaleX(var(--shine-s, 0.6));

mix-blend-mode: screen;
opacity: 0.85;
}

/* ===== 裏面の反射（弱く・鈍く） ===== */
.back::after {
opacity: calc(0.55 + var(--shine-edge, 0) * 0.6);
content: '';
position: absolute;
inset: 12%;
pointer-events: none;

background:
linear-gradient(
110deg,
rgba(255,255,255,0) 42%,
rgba(255,255,255,0.08) 48%,
rgba(255,255,255,0.16) 52%,
rgba(255,255,255,0.08) 56%,
rgba(255,255,255,0) 62%
);

filter: blur(8px);
transform:
translateX(var(--shine-x, 0%))
scaleX(calc(var(--shine-s, 0.6) * 1.05));

mix-blend-mode: screen;
opacity: 0.55;
}

/* 表 */
.front {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png");
}

/* 裏 */
.back {
background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/top.png");
transform: rotateY(180deg);
}
</style>
</head>

<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
let manualCenter = 0;

const SPEED = 0.1;
const DRAG_LIMIT = 70;
const DRAG_SENS = 0.35;

let lastTime = performance.now();

/* 自動回転 */
function animate() {

const baseSpeed = SPEED || 0.1;

// 真横直前だけ加速
const angle = Math.abs(((rotation % 180) + 180) % 180 - 90);
const approach = Math.max(0, 1 - angle / 25);
const accel = Math.pow(approach, 2) * 0.15;

rotation += baseSPEED * (1 + accel);

card.style.transform = `rotateY(${rotation}deg)`;
requestAnimationFrame(animate);
}

function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;

/* 光の位置（正面付近で一番強く） */
const a = ((rotation % 360) + 360) % 360;
const d = Math.abs(a <= 180 ? a : 360 - a);
  
const t = Math.max(0, 1 - d / 120);

const x = (-20 + t * 40);

const s = 0.6 + t * 0.4;
front.style.setProperty('--shine-x', `${x}%`);
front.style.setProperty ('--shine-s', s.toFixed(3));
}

/* 入力 */
function getX(e) {
return e.touches ? e.touches[0].clientX : e.clientX;
}

function startDrag(e) {
isDragging = true;
autoRotate = false;
lastX = getX(e);

const a = ((rotation % 360) + 360) % 360;
manualCenter = (a < 90 || a > 270)
? rotation - a
: rotation - (a - 180);
}

function onDrag(e) {
if (!isDragging) return;

const x = getX(e);
const dx = x - lastX;

let offset = dx * DRAG_SENS;
offset = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, offset));

rotation = manualCenter + offset;
applyTransform();

lastX = x;
}

function endDrag() {
isDragging = false;
autoRotate = true;
}

/* mouse */
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

/* touch */
card.addEventListener('touchstart', startDrag, { passive: true });
card.addEventListener('touchmove', onDrag, { passive: true });
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
