<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Rotating Card Stable</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}
body {
display: flex;
justify-content: center;
align-items: center;
touch-action: pan-x pan-y;
}
.wrap {
width: 90vw;
max-width: 260px;
aspect-ratio: 260 / 400;
perspective: 1200px;
}
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
border-radius: 12px;
}
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
border-radius: 12px;
transition: filter 0.05s;
}
.front::after, .back::after {
content: '';
position: absolute;
inset: 10%;
pointer-events: none;
filter: blur(4px);
transform: translateX(var(--shine-x, 0%));
mix-blend-mode: screen;
border-radius: 12px;
}
.front::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.back::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.front { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png"); }
.back { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/zebra.png"); transform: rotateY(180deg); }
</style>
</head>
<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');
const back = document.querySelector('.back');

let rotation = 0; // 現在の回転角度
let autoRotate = true; // 自動回転中フラグ
let isDragging = false; // ドラッグ中フラグ
let lastX = 0;
const DRAG_SENS = 0.3; // ドラッグ感度
const DRAG_LIMIT = 60; // 正面基準 ±60°
const SIDE_THRESHOLD = 120; // 側面とみなす角度範囲
let manualCenter = 0; // ドラッグ基準角度

function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

// 光と明るさ
function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;
const rad = rotation * Math.PI / 180;
const angleMod = ((rotation % 360) + 360) % 360;

// 側面に近いほど暗くなる
const sideDiff = Math.min(Math.abs(angleMod % 180 - 90)/90, 1);
const flow = (1 - sideDiff) * 0.15 * Math.sin(rad);
const brightness = 1.0 + flow;

const shineX = Math.sin(rad) * 30;

front.style.setProperty('--shine-x', `${shineX}%`);
back.style.setProperty('--shine-x', `${shineX}%`);
front.style.filter = `brightness(${brightness})`;
back.style.filter = `brightness(${brightness})`;
}

// 自動回転
function animate() {
if(autoRotate && !isDragging){
rotation += 1.6;
}
applyTransform();
requestAnimationFrame(animate);
}
animate();

// 滑らかに目標角度まで回転
function smoothTo(target){
const speed = 0.15;
function step(){
const diff = target - rotation;
if(Math.abs(diff) < 0.5){
rotation = target;
applyTransform();
return;
}
rotation += diff * speed;
applyTransform();
requestAnimationFrame(step);
}
step();
}

// ドラッグ開始
function startDrag(e){
const angleMod = ((rotation % 360) + 360) % 360;

const nearSide = angleMod < SIDE_THRESHOLD || (angleMod > 180 - SIDE_THRESHOLD && angleMod < 180 + SIDE_THRESHOLD) || angleMod > 360 - SIDE_THRESHOLD;

if(nearSide){
// 側面クリック時は自動回転停止して正面に戻す
autoRotate = false;
isDragging = false;
if(angleMod >= 0 && angleMod < 180){
smoothTo(0);
} else {
smoothTo(180);
}
} else {
// 正面基準 ±60° の範囲でドラッグ開始
isDragging = true;
autoRotate = false;
lastX = getX(e);
// 現在の角度を最も近い正面（0 or 180）基準に
manualCenter = (angleMod < 90 || angleMod > 270) ? 0 : 180;
}
}

// ドラッグ中
function onDrag(e){
if(!isDragging) return;
let delta = (getX(e) - lastX) * DRAG_SENS;
delta = Math.max(-DRAG_LIMIT, Math.min(DRAG_LIMIT, delta));
rotation = manualCenter + delta;
lastX = getX(e);
applyTransform();
}

// ドラッグ終了
function endDrag(){
if(!isDragging) return;
isDragging = false;
autoRotate = true;
}

// マウス
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);

// タッチ
card.addEventListener('touchstart', startDrag,{passive:true});
card.addEventListener('touchmove', onDrag,{passive:true});
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
