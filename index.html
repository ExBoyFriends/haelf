<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Rotating Card with Side Handling</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
background: #000;
}
body {
display: flex;
justify-content: center;
align-items: center;
touch-action: pan-x pan-y;
}
.wrap {
width: 90vw;
max-width: 260px;
aspect-ratio: 260 / 400;
perspective: 1200px;
}
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
user-select: none;
touch-action: none;
border-radius: 12px;
}
.face {
position: absolute;
inset: 0;
backface-visibility: hidden;
background-size: cover;
background-position: center;
background-repeat: no-repeat;
border-radius: 12px;
transition: filter 0.05s;
}
.front::after, .back::after {
content: '';
position: absolute;
inset: 10%;
pointer-events: none;
filter: blur(4px);
transform: translateX(var(--shine-x, 0%));
mix-blend-mode: screen;
border-radius: 12px;
}
.front::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.back::after { background: linear-gradient(110deg, rgba(255,255,255,0.12) 0%, rgba(255,255,255,0) 100%); opacity: 0.6; }
.front { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/king.of.spades.png"); }
.back { background-image: url("https://raw.githubusercontent.com/ExBoyFriends/haelf/main/zebra.png"); transform: rotateY(180deg); }
</style>
</head>
<body>

<div class="wrap">
<div class="card" id="card">
<div class="face front"></div>
<div class="face back"></div>
</div>
</div>

<script>
const card = document.getElementById('card');
const front = document.querySelector('.front');
const back = document.querySelector('.back');

let rotation = 0;
let autoRotate = true;
let isDragging = false;
let lastX = 0;
const DRAG_SENS = 0.3;
const SIDE_ANGLE = 75; // ±75°を側面扱い

// 光と明るさ
function applyTransform() {
card.style.transform = `rotateY(${rotation}deg)`;
const rad = rotation * Math.PI / 180;
const shineX = Math.sin(rad) * 30;
front.style.setProperty('--shine-x', `${shineX}%`);
back.style.setProperty('--shine-x', `${shineX}%`);
const base = 0.85;
const flow = 0.15 * Math.sin(rad);
const brightness = base + flow;
front.style.filter = `brightness(${brightness})`;
back.style.filter = `brightness(${brightness})`;
}

// 自動回転
function animate() {
if(autoRotate && !isDragging){
rotation += 1.6;
}
applyTransform();
requestAnimationFrame(animate);
}
animate();

// ドラッグ操作
function getX(e){ return e.touches ? e.touches[0].clientX : e.clientX; }

function startDrag(e){
const angleMod = ((rotation % 360) + 360) % 360;
const sideLeft = 360 - SIDE_ANGLE;
const sideRight = SIDE_ANGLE;
// 側面付近ならドラッグ不可
if((angleMod >= sideRight && angleMod <= 180 - sideRight) || (angleMod >= 180 + sideRight && angleMod <= 360 - sideRight)){
isDragging = true;
autoRotate = false;
lastX = getX(e);
}
}

function onDrag(e){
if(!isDragging) return;
const delta = (getX(e) - lastX) * DRAG_SENS;
rotation += delta;
lastX = getX(e);
applyTransform();
}

function endDrag(){
if(!isDragging) return;
isDragging = false;
autoRotate = true;
}

// クリックで側面から正面に戻す
card.addEventListener('click', () => {
const angleMod = ((rotation % 360) + 360) % 360;
if(angleMod > SIDE_ANGLE && angleMod < 180 - SIDE_ANGLE){ // 側面左寄り
rotation = 0; // 表正面
} else if(angleMod > 180 + SIDE_ANGLE && angleMod < 360 - SIDE_ANGLE){ // 側面右寄り
rotation = 180; // 裏正面
}
});

// マウス
card.addEventListener('mousedown', startDrag);
window.addEventListener('mousemove', onDrag);
window.addEventListener('mouseup', endDrag);
// タッチ
card.addEventListener('touchstart', startDrag,{passive:true});
card.addEventListener('touchmove', onDrag,{passive:true});
card.addEventListener('touchend', endDrag);
</script>

</body>
</html>
